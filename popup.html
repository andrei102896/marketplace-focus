<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="extension.css">
</head>
<body class="popup-page">
<div class="popup-shell">
    <header class="popup-head">
        <h2 data-i18n="popupTitle">Facebook Reels Blocker</h2>
        <p class="subtitle" data-i18n="popupSubtitle">Use Facebook without Reels</p>
    </header>

    <section class="popup-card">
        <div class="popup-row">
            <span class="label-text" data-i18n="popupBlockReelsLabel">Block Reels</span>
            <label class="switch">
                <input type="checkbox" id="toggle">
                <span class="slider"></span>
            </label>
        </div>
    </section>

    <section class="popup-card">
        <button id="pause-action" class="button button-secondary" type="button" data-i18n="popupLoading">Loading...</button>
        <p id="pause-status" data-i18n="popupLoading">Loading...</p>
    </section>

    <section class="popup-promo">
        <span class="popup-promo-kicker">From the maker</span>
        <div class="popup-promo-inner">
            <span class="popup-promo-icon" aria-hidden="true">⌖</span>
            <div>
                <p class="popup-promo-title">Filter Marketplace by distance</p>
                <p class="popup-promo-copy">MarketClean adds a distance filter so nearby listings stay easy to find.</p>
            </div>
        </div>
        <a class="popup-promo-cta" href="https://chromewebstore.google.com/detail/marketclean-facebook-mark/haknlbeddmjimamnjdadamhpokgngbln?hl=en-GB&utm_source=ext_sidebar" target="_blank" rel="noopener noreferrer">
            Try MarketClean - Free
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2.5 6h7M6.5 3l3 3-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
    </section>

    <footer class="popup-footer">
        <button type="button" id="open-options" data-i18n="popupSettings">Settings</button>
        <a href="https://chrome.google.com/webstore/detail/lchgjnkonkmccfpjjmnkbegibdgjocog/reviews" target="_blank" rel="noopener noreferrer" data-i18n="popupRate">Rate</a>
        <a href="https://www.buymeacoffee.com/marketplacefocus" target="_blank" rel="noopener noreferrer" data-i18n="popupSupport">Support</a>
    </footer>
</div>

<script src="popup.js"></script>
</body>
</html>
